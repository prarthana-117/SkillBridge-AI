<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account · SkillBridge AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%230284c7%22/%3E%3Cpath d=%22M4 17h16M6 17v-4a6 6 0 0 1 12 0v4%22 stroke=%22white%22 stroke-width=%222%22 fill=%22none%22/%3E%3C/svg%3E">
</head>
<body>
  <div class="auth-wrap">
    <div class="card auth-card">
      <a href="/" class="logo"><span class="logo-mark"><i data-icon="logo" data-size="20"></i></span>SkillBridge<b>AI</b></a>
      <h1>Create your free account</h1>
      <p class="sub">Get your skill-gap report in 2 minutes.</p>
      <div class="error-box hidden" id="error"></div>
      <form id="authForm" data-mode="register" novalidate>
        <div class="field"><label for="full_name">Full name</label><input type="text" id="full_name" name="full_name" autocomplete="name" required></div>
        <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" autocomplete="email" required></div>
        <div class="field"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
          <div class="small muted" style="margin-top:.3rem">At least 8 characters.</div></div>
        <button class="btn" type="submit">Create account</button>
      </form>
      <p class="auth-foot">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
